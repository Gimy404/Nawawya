<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نواوية — المَشكاة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   نواوية — نظام «المَشكاة»
   أصباغ المخطوط: لازَوَرْد · ذَهَب · زِنْجَفْر · زَنْجار · عَفْص · رَق · نِيل
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* رَق — vellum */
  --bg:#F3F1EA;
  --surface:#FAF8F2;
  --inset:#EDE9DD;
  /* عَفْص — iron-gall ink (brown-black, never grey-black) */
  --ink:#241E16;
  --ink-mute:#6B6054;
  --rule:#D8D1C2;
  --rule-soft:#E7E1D4;
  /* لازَوَرْد — lapis lazuli: the identity */
  --lapis:#1B3C86;
  --lapis-deep:#142C63;
  --lapis-soft:#E3E8F6;
  --on-lapis:#FFFFFF;
  /* ذَهَب — gold leaf */
  --gold:#A9761B;
  --gold-ink:#8A5F12;      /* small text: 4.99:1 on vellum */
  --gold-bright:#D9A43C;
  --gold-soft:#F6EBD3;
  --on-gold:#2A1D05;
  /* زِنْجَفْر — vermillion: INK ONLY, never a background */
  --verm:#B33018;
  /* زَنْجار — verdigris: "correct" only, never identity */
  --verd:#1C6F4C;
  --verd-soft:#DDEEE5;
  --on-verd:#FFFFFF;
  --heart:#B33018;

  /* ألوان العُنوان تبقى عميقة في الوضعين لأنها تحمل نصًّا أبيض */
  --band-1:#1B3C86; --band-2:#7A5310; --band-3:#17603F;
  --band-4:#5E2560; --band-5:#8A3C1C; --band-6:#6B571B;

  --unit-1:#1B3C86;  /* لازَوَرْد */
  --unit-2:#8A5F12;  /* ذَهَب */
  --unit-3:#1C6F4C;  /* زَنْجار */
  --unit-4:#6B2A6B;  /* أرجوان */
  --unit-5:#9A4420;  /* طين محروق */
  --unit-6:#7A6420;  /* رمل */

  --lip:4px;
  --ease:cubic-bezier(.23,1,.32,1);
}
[data-theme="dark"]{
  /* نِيل — indigo night, not neutral black */
  --bg:#0D1328;
  --surface:#141B33;
  --inset:#1B2342;
  --ink:#F0EBE0;
  --ink-mute:#9AA3BF;
  --rule:#2A3254;
  --rule-soft:#1E2642;
  --lapis:#5B8AE6;
  --lapis-deep:#3F6DC4;
  --lapis-soft:#1A2545;
  --on-lapis:#0A1024;
  --gold:#E3B45A;
  --gold-ink:#E3B45A;
  --gold-bright:#F3CE84;
  --gold-soft:#2A2415;
  --on-gold:#1A1405;
  --verm:#F2715A;
  --verd:#49C68C;
  --verd-soft:#11301F;
  --on-verd:#06240F;
  --heart:#F2715A;
  --unit-1:#5B8AE6; --unit-2:#E3B45A; --unit-3:#49C68C;
  --unit-4:#C58BC5; --unit-5:#E39070; --unit-6:#D4BE6A;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Readex Pro',system-ui,sans-serif;
  font-weight:400;line-height:1.55;
  padding:28px 16px 64px;
}

/* ── الخطوط: Amiri = من التراث · Readex = كلام التطبيق ─────────── */
.naskh{font-family:'Amiri',serif}

/* ── لوح العرض ──────────────────────────────────────────────────── */
.wall{display:flex;flex-wrap:wrap;gap:40px 26px;justify-content:center;align-items:flex-start;max-width:1800px;margin:0 auto}
.slot{width:412px;flex:0 0 auto}
.slot > figcaption{
  font-size:12.5px;font-weight:600;color:var(--ink-mute);
  padding:0 2px 8px;display:flex;align-items:baseline;gap:7px;
}
.slot > figcaption b{color:var(--verm);font-weight:700;font-variant-numeric:tabular-nums}
.phone{
  width:412px;height:892px;background:var(--bg);color:var(--ink);
  border:1px solid var(--rule);border-radius:30px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 1px 0 var(--rule);
}
.phone.dk{--bg:#0D1328;--surface:#141B33;--inset:#1B2342;--ink:#F0EBE0;--ink-mute:#9AA3BF;
  --rule:#2A3254;--rule-soft:#1E2642;--lapis:#5B8AE6;--lapis-deep:#3F6DC4;--lapis-soft:#1A2545;
  --on-lapis:#0A1024;--gold:#E3B45A;--gold-ink:#E3B45A;--gold-bright:#F3CE84;--gold-soft:#2A2415;
  --on-gold:#1A1405;--verm:#F2715A;--verd:#49C68C;--verd-soft:#11301F;--on-verd:#06240F;--heart:#F2715A;
  --unit-1:#5B8AE6;--unit-2:#E3B45A;--unit-3:#49C68C;--unit-4:#C58BC5;--unit-5:#E39070;--unit-6:#D4BE6A;
  background:#0D1328;color:#F0EBE0;border-color:#2A3254}
.scroll{flex:1;overflow:hidden;position:relative}
/* كل أيقونة بحجم افتراضي صغير؛ الكبيرة تتجاوزه بصفّها */
.phone svg{width:18px;height:18px;flex:none}
.phone .ring{width:84px;height:84px}
.phone .lamp svg,.phone .wave svg,.phone .qalam svg{width:100%;height:auto}
.phone .rseal{width:118px;height:118px}
.opt .n svg{width:15px;height:15px}
.pill svg{width:13px;height:13px}
.vmark svg{width:21px;height:21px}
.notif .app svg{width:20px;height:20px}

/* ── شريط الحالة: شريط رقيق، لا بطاقة ──────────────────────────── */
.strip{
  display:flex;align-items:center;gap:16px;
  padding:13px 16px 11px;border-bottom:1px solid var(--rule);
  background:var(--surface);
}
.stat{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.stat svg{width:17px;height:17px;flex:none}
.stat.xp{color:var(--lapis)}
.stat.fire{color:var(--gold-ink)}
.hearts{display:flex;gap:3px;margin-inline-start:auto}
.hearts svg{width:16px;height:16px}
.cog{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-mute)}
.cog svg{width:19px;height:19px}

/* ── العُنوان المُذهَّب ('unwān) ─────────────────────────────────── */
.unwan{
  position:relative;margin:18px 14px 6px;padding:15px 16px 16px;
  background:var(--uc);border-radius:3px;
  isolation:isolate;overflow:hidden;
}
.unwan::before{ /* شبكة الگِرِه — نجمة ثمانية متشابكة */
  content:"";position:absolute;inset:0;z-index:-1;opacity:.18;
  background-size:34px 34px;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2234%22 height=%2234%22><g fill=%22none%22 stroke=%22white%22 stroke-width=%221%22><rect x=%227%22 y=%227%22 width=%2220%22 height=%2220%22/><rect x=%227%22 y=%227%22 width=%2220%22 height=%2220%22 transform=%22rotate(45 17 17)%22/></g></svg>');
}
.unwan::after{ /* gold hairline frame, inset — manuscript rule */
  content:"";position:absolute;inset:5px;border:1px solid rgba(217,164,60,.55);
  border-radius:1px;pointer-events:none;
}
.unwan-row{display:flex;align-items:center;gap:12px;position:relative}
.cartouche{
  flex:none;width:38px;height:38px;display:grid;place-items:center;
  background:var(--gold-bright);color:#2A1D05;border-radius:50%;
  font-family:'Amiri',serif;font-size:21px;font-weight:700;line-height:1;
  box-shadow:inset 0 0 0 1px rgba(42,29,5,.35);
}
.unwan h2{
  font-family:'Amiri',serif;font-size:23px;font-weight:700;line-height:1.3;
  color:#fff;letter-spacing:0;text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.unwan .meta{
  font-size:11.5px;font-weight:500;color:rgba(255,255,255,.88);
  margin-top:3px;letter-spacing:.2px;
}
.unwan .bar{
  margin-top:11px;height:5px;border-radius:99px;
  background:rgba(0,0,0,.26);overflow:hidden;position:relative;
}
.unwan .bar i{display:block;height:100%;background:var(--gold-bright);border-radius:99px}

/* ── سلسلة الإسناد ─────────────────────────────────────────────── */
.isnad{position:relative;padding:6px 0 10px}
.isnad::before{ /* the ribbon, on the right (RTL reading spine) */
  content:"";position:absolute;top:0;bottom:0;right:71px;width:3px;
  background:
    repeating-linear-gradient(to bottom,
      var(--rule) 0 9px, transparent 9px 15px);
}
.link{position:relative;display:flex;align-items:center;gap:0;padding:7px 0;min-height:76px}

/* الخاتم — the seal */
.seal{
  position:absolute;right:38px;width:70px;height:70px;flex:none;
  display:grid;place-items:center;border-radius:50%;
  font-family:'Amiri',serif;font-size:25px;font-weight:700;line-height:1;
  border:2px solid var(--sc);color:var(--sc);background:var(--surface);
  box-shadow:0 var(--lip) 0 var(--sl);
}
.seal::after{ /* inner manuscript ring */
  content:"";position:absolute;inset:5px;border:1px solid var(--sc);
  border-radius:50%;opacity:.35;
}
.seal.done{background:var(--gold-soft);--sc:var(--gold-ink);--sl:var(--gold)}
.seal.done svg{width:26px;height:26px}
.seal.now{
  background:var(--lapis);color:var(--on-lapis);--sc:var(--lapis);--sl:var(--lapis-deep);
  border-color:var(--lapis-deep);transform:scale(1.1);
}
.seal.now::after{border-color:rgba(255,255,255,.5);opacity:1}
.seal.now::before{ /* gold aura marks the single call-to-action */
  content:"";position:absolute;inset:-7px;border:2px solid var(--gold-bright);
  border-radius:50%;opacity:.95;
}
.seal.lock{background:var(--inset);--sc:var(--rule);--sl:var(--rule-soft);color:var(--ink-mute)}
.seal.lock svg{width:21px;height:21px}
.seal.prog{--sc:var(--lapis);--sl:var(--lapis-deep);background:var(--lapis-soft);color:var(--lapis);border-width:1.5px}
.ring{position:absolute;right:31px;transform:rotate(-90deg);pointer-events:none}

/* الحاشية — marginal gloss */
.gloss{display:flex;align-items:center;gap:9px;margin-inline-start:124px;margin-inline-end:18px;width:100%;min-width:0}
.gloss .t{
  font-family:'Amiri',serif;font-size:17.5px;font-weight:700;line-height:1.35;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gloss.off .t{color:var(--ink-mute);font-weight:400}
.gloss .lead{flex:1;min-width:12px;border-bottom:1px dotted var(--rule);height:1px;margin-bottom:4px}
.gloss .pct{font-size:11px;font-weight:600;color:var(--gold-ink);font-variant-numeric:tabular-nums;flex:none}

/* نداء البدء — the one CTA bubble */
.gloss.col{flex-direction:column;align-items:flex-start;gap:7px}
.cue{
  position:relative;align-self:flex-start;
  background:var(--lapis);color:var(--on-lapis);
  padding:8px 15px 9px;border-radius:4px;
  font-size:13.5px;font-weight:700;white-space:nowrap;
  box-shadow:0 3px 0 var(--lapis-deep);
}
.cue::after{ /* سهم يشير إلى الخاتم على اليمين */
  content:"";position:absolute;right:-6px;top:50%;margin-top:-5px;
  border:5px solid transparent;border-left-color:var(--lapis);
}
.link.active{min-height:106px}

/* مصباح الوحدة — the lamp */
.lampwrap{display:flex;justify-content:center;padding:4px 0 16px;position:relative}
.lamp{width:78px;height:92px;position:relative;z-index:2;background:var(--bg);padding:0 6px}
.lamp svg{width:100%;height:100%;display:block}
.lampcap{
  position:absolute;bottom:-2px;right:50%;transform:translateX(50%);
  font-size:11px;font-weight:600;color:var(--gold-ink);white-space:nowrap;
}

/* ── الأزرار ───────────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:54px;padding:14px 18px;border:0;border-radius:6px;
  font-family:'Readex Pro',sans-serif;font-size:16px;font-weight:600;
  background:var(--lapis);color:var(--on-lapis);
  box-shadow:0 var(--lip) 0 var(--lapis-deep);
  cursor:pointer;transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.btn:active{transform:translateY(var(--lip));box-shadow:0 0 0 var(--lapis-deep)}
.btn svg{width:19px;height:19px;flex:none}
.btn.gold{background:var(--gold-bright);color:var(--on-gold);box-shadow:0 var(--lip) 0 var(--gold)}
.btn.good{background:var(--verd);color:var(--on-verd);box-shadow:0 var(--lip) 0 #124A32}
.btn.quiet{background:transparent;color:var(--lapis);box-shadow:none;border:1.5px solid var(--rule);min-height:50px}
.btn.quiet:active{transform:none;background:var(--lapis-soft)}
.btn.off{background:var(--inset);color:var(--ink-mute);box-shadow:0 var(--lip) 0 var(--rule-soft);cursor:not-allowed}
.btn.off:active{transform:none;box-shadow:0 var(--lip) 0 var(--rule-soft)}
.btn.sm{min-height:44px;font-size:14px;padding:10px 14px;--lip:3px}

/* ── شريط الدرس: مَدّة قلم ─────────────────────────────────────── */
.lessontop{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--rule)}
.x{width:38px;height:38px;flex:none;display:grid;place-items:center;color:var(--ink-mute);border-radius:50%}
.x svg{width:20px;height:20px}
.qalam{flex:1;height:14px;position:relative}
.qalam svg{width:100%;height:100%;display:block;overflow:visible}

/* ── الأسئلة ───────────────────────────────────────────────────── */
.body{padding:18px 18px 0;overflow:hidden}
.qkind{
  font-size:11.5px;font-weight:700;color:var(--verm);
  display:flex;align-items:center;gap:7px;margin-bottom:9px;
}
.qkind::after{content:"";flex:1;height:1px;background:var(--rule)}
.ask{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:15px;color:var(--ink)}

/* كتلة المتن: ليست بطاقة — كتلة مسطورة بهامش */
.matn{
  background:var(--inset);border-radius:2px;
  border-inline-start:3px solid var(--gold-bright);
  padding:16px 17px 15px;margin-bottom:16px;position:relative;
}
.matn p{
  font-family:'Amiri',serif;font-size:22px;line-height:2.0;
  color:var(--ink);text-align:justify;text-justify:inter-word;
}
.matn .blank{
  display:inline-block;min-width:92px;border-bottom:2.5px solid var(--verm);
  margin:0 4px;vertical-align:-3px;
}
.takhrij{
  font-family:'Amiri',serif;font-size:14px;line-height:1.6;color:var(--verm);
  margin-top:11px;padding-top:9px;border-top:1px solid var(--rule);
}
.hl{color:var(--gold-ink)}
.hl.on{background:var(--gold-bright);color:var(--on-gold);box-shadow:0 0 0 4px var(--gold-bright);border-radius:2px}

/* الخيارات: ترقيم زِنْجَفْري + كتلة مسطورة، لا بطاقات متماثلة */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:start;
  padding:13px 14px;background:var(--surface);
  border:1.5px solid var(--rule);border-radius:4px;
  box-shadow:0 3px 0 var(--rule-soft);cursor:pointer;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--rule-soft)}
.opt .n{
  flex:none;width:26px;height:26px;display:grid;place-items:center;
  font-family:'Amiri',serif;font-size:16px;font-weight:700;line-height:1;
  color:var(--verm);border:1px solid var(--rule);border-radius:50%;
}
.opt .txt{font-size:15.5px;line-height:1.55;padding-top:2px}
.opt .txt.naskh{font-family:'Amiri',serif;font-size:19px;line-height:1.75}
.opt.sel{border-color:var(--lapis);background:var(--lapis-soft);box-shadow:0 3px 0 var(--lapis)}
.opt.sel .n{color:var(--lapis);border-color:var(--lapis)}
.opt.ok{border-color:var(--verd);background:var(--verd-soft);box-shadow:0 3px 0 var(--verd)}
.opt.ok .n{color:var(--verd);border-color:var(--verd)}
.opt.no{border-color:var(--verm);background:color-mix(in srgb,var(--verm) 11%,var(--surface));box-shadow:0 3px 0 var(--verm)}
.opt.no .n{color:var(--verm);border-color:var(--verm)}

/* بنك المقاطع — tap-to-place */
.slots{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.slotline{
  min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1.5px dashed var(--rule);
}
.slotline .idx{
  flex:none;width:23px;height:23px;display:grid;place-items:center;
  font-family:'Amiri',serif;font-size:14px;font-weight:700;
  color:var(--verm);
}
.chip{
  display:inline-block;padding:9px 13px;background:var(--surface);
  border:1.5px solid var(--rule);border-radius:4px;box-shadow:0 3px 0 var(--rule-soft);
  font-family:'Amiri',serif;font-size:18px;line-height:1.6;cursor:pointer;
}
.chip.placed{border-color:var(--lapis);background:var(--lapis-soft);box-shadow:0 3px 0 var(--lapis)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.banklbl{font-size:11.5px;font-weight:700;color:var(--ink-mute);margin-bottom:8px}

/* ── قاع الدرس ─────────────────────────────────────────────────── */
.foot{margin-top:auto;padding:14px 18px 18px;background:var(--surface);border-top:1px solid var(--rule)}
.verdict{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
.vmark{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.vmark svg{width:21px;height:21px}
.vmark.ok{background:var(--verd);color:var(--on-verd)}
.vmark.no{background:var(--verm);color:#fff}
.vhead{font-family:'Amiri',serif;font-size:21px;font-weight:700;line-height:1.3}
.vhead.ok{color:var(--verd)} .vhead.no{color:var(--verm)}
.vsub{font-size:13.5px;line-height:1.6;color:var(--ink-mute);margin-top:3px}
.vsub .naskh{color:var(--ink);font-size:17px}
.foot.ok{background:var(--verd-soft)} .foot.no{background:color-mix(in srgb,var(--verm) 9%,var(--surface))}

/* ── مشغّل التلاوة ─────────────────────────────────────────────── */
.player{padding:13px 16px 15px;background:var(--surface);border-top:1px solid var(--rule)}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.play{
  flex:none;width:52px;height:52px;border-radius:50%;border:0;
  background:var(--lapis);color:var(--on-lapis);display:grid;place-items:center;
  box-shadow:0 var(--lip) 0 var(--lapis-deep);cursor:pointer;
}
.play svg{width:22px;height:22px}
.wave{flex:1}
.wave svg{width:100%;height:30px;display:block}
.ptime{font-size:12px;font-weight:600;color:var(--ink-mute);font-variant-numeric:tabular-nums;flex:none}
.pchips{display:flex;gap:7px;flex-wrap:wrap}
.pchip{
  padding:7px 12px;border:1px solid var(--rule);border-radius:99px;
  background:transparent;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:5px;
}
.pchip svg{width:14px;height:14px}
.pchip.on{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.reciter{font-size:11.5px;color:var(--ink-mute);margin-top:10px;display:flex;align-items:center;gap:6px}
.reciter svg{width:13px;height:13px;color:var(--verm)}

/* ── النتيجة ───────────────────────────────────────────────────── */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;text-align:center}
.rseal{width:118px;height:118px;margin-bottom:18px}
.rhead{font-family:'Amiri',serif;font-size:31px;font-weight:700;line-height:1.3;margin-bottom:8px}
.rline{font-size:15px;line-height:1.65;color:var(--ink-mute);max-width:300px}
.tally{display:flex;gap:10px;width:100%;margin:24px 0 8px}
.tcell{flex:1;padding:14px 8px;background:var(--surface);border-radius:4px;border-top:3px solid var(--tc)}
.tcell .v{font-family:'Amiri',serif;font-size:27px;font-weight:700;line-height:1.1;color:var(--tc)}
.tcell .k{font-size:11px;font-weight:600;color:var(--ink-mute);margin-top:4px}

/* ── عام ───────────────────────────────────────────────────────── */
.h1{font-family:'Amiri',serif;font-size:27px;font-weight:700;line-height:1.3}
.sec{padding:16px 18px 0}
.seclbl{font-size:11.5px;font-weight:700;color:var(--verm);display:flex;align-items:center;gap:7px;margin-bottom:11px}
.seclbl::after{content:"";flex:1;height:1px;background:var(--rule)}
.row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row .ic{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:4px;background:var(--lapis-soft);color:var(--lapis)}
.row .ic svg{width:19px;height:19px}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:14.5px;font-weight:600}
.row .main span{display:block;font-size:12px;color:var(--ink-mute);margin-top:2px;line-height:1.5}
.sw{flex:none;width:46px;height:27px;border-radius:99px;background:var(--rule);position:relative;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--verd)}
.sw.on::after{transform:translateX(-19px)}
.nav{display:flex;border-top:1px solid var(--rule);background:var(--surface)}
.nav a{flex:1;padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-mute);text-decoration:none;font-size:10.5px;font-weight:600;position:relative}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--lapis)}
.nav a.on::before{content:"";position:absolute;top:-1px;right:22%;left:22%;height:2.5px;background:var(--lapis);border-radius:0 0 3px 3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--inset);color:var(--ink-mute)}
.pill.g{background:var(--gold-soft);color:var(--gold-ink)}
.pill.v{background:var(--verd-soft);color:var(--verd)}
.filters{display:flex;gap:7px;overflow:hidden;padding:0 18px 12px}
.search{display:flex;align-items:center;gap:9px;margin:14px 18px 12px;padding:12px 14px;background:var(--inset);border-radius:4px;color:var(--ink-mute);font-size:14px}
.search svg{width:18px;height:18px;flex:none}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.num{
  flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:2px;
  font-family:'Amiri',serif;font-size:19px;font-weight:700;
  background:var(--inset);color:var(--verm);border-inline-start:2px solid var(--verm);
}
.sheet{position:absolute;inset:0;background:rgba(10,13,26,.5);display:flex;align-items:flex-end}
.sheetbody{width:100%;background:var(--surface);border-radius:14px 14px 0 0;padding:22px 20px 20px;text-align:center}
.notif{
  display:flex;gap:11px;padding:12px 13px;background:var(--surface);
  border:1px solid var(--rule);border-radius:10px;margin-bottom:9px;text-align:start;
}
.notif .app{flex:none;width:34px;height:34px;border-radius:8px;background:var(--lapis);display:grid;place-items:center}
.notif .app svg{width:20px;height:20px;color:var(--gold-bright)}
.notif .nb{flex:1;min-width:0}
.notif .nt{font-size:12px;font-weight:700;color:var(--ink-mute);display:flex;gap:6px}
.notif .nm{font-size:13.5px;line-height:1.5;margin-top:3px}
.notif .nm .naskh{font-family:'Amiri',serif;font-size:15.5px}
.onb{flex:1;display:flex;flex-direction:column;padding:28px 24px 22px;text-align:center;align-items:center;justify-content:center}
hr.rule{border:0;border-top:1px solid var(--rule);margin:0 18px}
.pagehead{max-width:1100px;margin:0 auto 36px;text-align:center}
.pagehead h1{font-family:'Amiri',serif;font-size:42px;font-weight:700;line-height:1.25;margin-bottom:10px}
.pagehead p{color:var(--ink-mute);font-size:15px;line-height:1.7;max-width:620px;margin:0 auto}
.swatches{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.sw2{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;border:1px solid var(--rule);border-radius:99px;font-size:12px;font-weight:600}
.sw2 i{width:17px;height:17px;border-radius:50%;display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="pagehead">
  <h1>نواوية · نظام «المَشكاة»</h1>
  <p>الطريق إسناد، والعقدة خاتم، وفاتحة الوحدة عُنوان مُذهَّب. اللون من أصباغ المخطوط
     لا من لوحة Material: لازَوَرْد للهوية، وذَهَب للإتقان، وزِنْجَفْر حِبرًا للترقيم والتخريج،
     والأخضر للصواب وحده.</p>
  <div class="swatches">
    <span class="sw2"><i style="background:#1B3C86"></i>لازَوَرْد</span>
    <span class="sw2"><i style="background:#D9A43C"></i>ذَهَب</span>
    <span class="sw2"><i style="background:#B33018"></i>زِنْجَفْر</span>

    <span class="sw2"><i style="background:#241E16"></i>عَفْص</span>

  </div>
</div>

<script>
/* ═══ المحتوى الحقيقي من المشروع (app/src/main/.../NawawiAuthenticCatalog) ═══ */
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const ic = (n,c="") => `<svg class="${c}"><use href="#i-${n}"/></svg>`;

/* ── الخاتم: حلقة تقدّم ──────────────────────────────────────── */
function ringSvg(pct, color){
  const r=40, C=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none"
    stroke="var(--rule)" stroke-width="3"/><circle cx="42" cy="42" r="${r}" fill="none"
    stroke="${color}" stroke-width="3.5" stroke-linecap="round"
    stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>`;
}

/* ── المصباح في المشكاة ──────────────────────────────────────── */
function lamp(lit, size=78){
  const glow = lit ? `<ellipse cx="39" cy="44" rx="25" ry="27" fill="var(--gold-bright)" opacity=".16"/>` : '';
  const flame = lit
    ? `<path d="M39 25c3.6 4.2 5.6 7 5.6 10.2 0 3.4-2.5 5.8-5.6 5.8s-5.6-2.4-5.6-5.8C33.4 32 35.4 29.2 39 25z" fill="var(--gold-bright)"/>
       <path d="M39 31.5c1.7 2.1 2.6 3.5 2.6 5.1 0 1.7-1.2 2.9-2.6 2.9s-2.6-1.2-2.6-2.9c0-1.6.9-3 2.6-5.1z" fill="#FFF3D6" opacity=".9"/>`
    : `<path d="M39 29c2.6 3 4 5 4 7.3 0 2.4-1.8 4.1-4 4.1s-4-1.7-4-4.1c0-2.3 1.4-4.3 4-7.3z" fill="none" stroke="var(--rule)" stroke-width="1.6"/>`;
  const stroke = lit ? 'var(--gold)' : 'var(--rule)';
  return `<svg viewBox="0 0 78 92" style="width:${size}px;height:${size*92/78}px">
    ${glow}
    <path d="M5 90V36C5 18.5 20 5 39 5s34 13.5 34 31v54" fill="none" stroke="${stroke}" stroke-width="2.2"/>
    <path d="M12 90V37C12 23 24 12 39 12s27 11 27 25v53" fill="none" stroke="${stroke}" stroke-width="1" opacity=".45"/>
    <path d="M39 43v5" stroke="${stroke}" stroke-width="1.4"/>
    <path d="M26 48h26l-4.5 16.5c0 4.5-4 7-8.5 7s-8.5-2.5-8.5-7L26 48z" fill="${lit?'var(--gold-soft)':'none'}" stroke="${stroke}" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M30.5 54h17" stroke="${stroke}" stroke-width="1" opacity=".55"/>
    ${flame}
  </svg>`;
}

/* ── مَدّة القلم: شريط تقدّم مُدبَّب ─────────────────────────── */
function qalam(pct){
  return `<svg viewBox="0 0 300 14" preserveAspectRatio="none">
    <defs><clipPath id="qc${pct}"><rect x="${300*(1-pct)}" y="0" width="${300*pct}" height="14"/></clipPath></defs>
    <path d="M300 4.2C220 3 120 2.4 2 5.6c118 3.4 218 3.2 298 2.2z" fill="var(--rule)"/>
    <path d="M300 3.4C218 2 118 1.4 2 5.6c116 4 216 4 298 3z" fill="var(--lapis)" clip-path="url(#qc${pct})"/>
  </svg>`;
}

/* ── موجة الصوت ──────────────────────────────────────────────── */
function wave(playedPct){
  let bars='';
  const n=46, seed=[3,7,12,18,9,14,22,27,19,11,8,16,24,29,21,13,6,10,17,25,30,23,15,9,5,12,20,28,26,18,11,7,14,21,27,24,16,10,6,13,19,26,22,15,8,4];
  for(let i=0;i<n;i++){
    const h=4+seed[i]*0.75, y=(30-h)/2;
    const on = (i/n) <= playedPct;
    bars+=`<rect x="${i*(300/n)+1}" y="${y}" width="${300/n-2.4}" height="${h}" rx="1.1"
      fill="${on?'var(--lapis)':'var(--rule)'}"/>`;
  }
  return `<svg viewBox="0 0 300 30" preserveAspectRatio="none">${bars}</svg>`;
}

/* ── ختم النتيجة: شمسة ──────────────────────────────────────── */
function rosette(size=118){
  let pts='';
  for(let i=0;i<16;i++){
    const a=(i*Math.PI*2)/16, r=i%2?38:52;
    pts+=`${59+r*Math.cos(a)},${59+r*Math.sin(a)} `;
  }
  return `<svg class="rseal" viewBox="0 0 118 118" style="width:${size}px;height:${size}px">
    <circle cx="59" cy="59" r="57" fill="none" stroke="var(--gold)" stroke-width="1.5"/>
    <circle cx="59" cy="59" r="51" fill="var(--gold-soft)"/>
    <polygon points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.3"/>
    <circle cx="59" cy="59" r="30" fill="var(--gold-bright)"/>
    <path d="m46 60 8.5 8.5L73 50" fill="none" stroke="var(--on-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

const UNITS=[
  {n:1,t:"أصولُ الإسلامِ والنيَّة",      c:"var(--band-1)", from:1,to:7,  done:3},
  {n:2,t:"حُرمةُ المسلمِ والوَرَع",      c:"var(--band-2)", from:8,to:14, done:0},
];
const H=[
  {n:1,t:"إنما الأعمال بالنيات",            s:"done", p:1.0},
  {n:2,t:"بيان الإسلام والإيمان والإحسان",  s:"done", p:1.0},
  {n:3,t:"أركان الإسلام الخمسة",            s:"prog", p:0.62},
  {n:4,t:"خلق الإنسان وأطوار خلقه",         s:"now",  p:0.0},
  {n:5,t:"النهي عن البدع والمحدثات",        s:"lock", p:0},
  {n:6,t:"الحلال بيّن والحرام بيّن",         s:"lock", p:0},
  {n:7,t:"الدين النصيحة",                   s:"lock", p:0},
];

const statusStrip = (hearts=3) => `
<div class="strip">
  <span class="stat xp">${ic('gem')}${AR(1240)}</span>
  <span class="stat fire">${ic('fire')}${AR(7)}</span>
  <span class="hearts">${[1,2,3,4,5].map(i=>
    `<svg style="color:${i<=hearts?'var(--heart)':'var(--rule)'}"><use href="#i-heart${i<=hearts?'':'-o'}"/></svg>`).join('')}</span>
  <span class="cog">${ic('cog')}</span>
</div>`;

const nav = (on) => `
<nav class="nav">
  ${[['route','الطريق'],['cycle','المراجعة'],['book','الأحاديث'],['person','حسابي']]
    .map(([i,l],k)=>`<a href="#" class="${k===on?'on':''}">${ic(i)}<span>${l}</span></a>`).join('')}
</nav>`;

/* ═══════════════ ١. شاشة الطريق ═══════════════ */
function screenPath(){
  let nodes='';
  for(const h of H){
    const isNow = h.s==='now';
    const ringColor = 'var(--gold-bright)';
    const inner = h.s==='done' ? ic('check')
                : h.s==='lock' ? ic('lock')
                : `<span>${AR(h.n)}</span>`;
    nodes += isNow ? `
      <div class="link active">
        <span class="seal now">${inner}</span>
        <span class="gloss col">
          <span class="cue">ابدأ الحديث ${AR(h.n)}</span>
          <span class="t naskh">${h.t}</span>
        </span>
      </div>` : `
      <div class="link">
        ${h.p>0&&h.p<1?ringSvg(h.p,ringColor):''}
        <span class="seal ${h.s}">${inner}</span>
        <span class="gloss ${h.s==='lock'?'off':''}">
          <span class="t naskh">${h.t}</span>
          <span class="lead"></span>
          ${h.s==='prog'?`<span class="pct">${AR(62)}٪</span>`:''}
        </span>
      </div>`;
  }
  const u=UNITS[0], u2=UNITS[1];
  return `
